name: FOS-001A Operating Mode Foundation

on:
  pull_request:
    paths:
      - 'src/modes/**'
      - 'src/learning-support/**'
      - 'src/calendar/**'
      - 'src/pages/Calendar.tsx'
      - 'src/pages/LearningSupportHome.tsx'
      - 'src/components/ParentDecisionInbox.tsx'
      - 'src/components/SchoolAgentIntakeSandbox.tsx'
      - 'src/intelligence/**'
      - 'api/_lib/**'
      - 'src/App.tsx'
      - 'src/pages/Settings.tsx'
      - 'src/components/ModuleSettings.tsx'
      - 'src/components/OperatingModeSettings.tsx'
      - '.github/workflows/operating-modes-foundation.yml'
      - 'tsconfig.json'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-and-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: VITE_FAMILY_OPERATING_MODES=true npm run build
      - run: VITE_FAMILY_OPERATING_MODES=true VITE_FAMILY_DECISION_INBOX=true npm run build
      - run: VITE_FAMILY_OPERATING_MODES=true VITE_FAMILY_DECISION_INBOX=true VITE_FAMILY_SCHOOL_AGENT_SANDBOX=true npm run build
      - run: node --experimental-strip-types --test src/learning-support/decisionInbox.test.ts src/learning-support/decisionInbox.safety.test.ts
      - run: node --experimental-strip-types --test api/_lib/verifiedIdentity.test.ts api/_lib/schoolAgentApprovalPreview.test.ts src/intelligence/captureCandidates.test.ts src/intelligence/schoolAgentSandbox.safety.test.ts
      - run: node --experimental-strip-types --test src/modes/noBackgroundAutoStart.test.ts
      - run: node --experimental-strip-types --test src/modes/resolver.test.ts src/modes/storage.test.ts src/learning-support/summary.test.ts
      # Test absolute calendar timestamps near midnight under an Eastern time zone.
      - run: TZ=America/New_York node --experimental-strip-types --test src/learning-support/summary.test.ts
      - run: node --experimental-strip-types --test src/calendar/date.test.ts src/calendar/scopedView.test.ts src/calendar/safety.test.ts
      - run: TZ=America/New_York node --experimental-strip-types --test src/calendar/date.test.ts src/calendar/scopedView.test.ts
