name: FOS-007 Local Supabase Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/fos007-local-supabase.yml'
      - 'supabase/config.toml'
      - 'supabase/proposals/fos_006_shared_workspace_school_ledger.sql'
      - 'supabase/proposals/fos_007_school_agent_rpc.sql'
      - 'tests/database/fos007_local_supabase*'
      - 'api/_lib/schoolAgentRpcExecutor.ts'
      - 'api/_lib/verifiedIdentity.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-and-api-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${DATABASE_URL:-}"
          if ! npx --yes supabase@2.117.0 start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$RUNNER_TEMP/fos007-start.log" 2>&1; then
            echo 'Disposable local Supabase failed to start; log withheld because it can contain local keys.' >&2
            exit 1
          fi
          npx --yes supabase@2.117.0 status -o env >"$RUNNER_TEMP/fos007-status.env"
          chmod 600 "$RUNNER_TEMP/fos007-status.env"
      - name: Apply synthetic fixture and review-only proposals
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          test -z "${DATABASE_URL:-}"
          psql -X -v ON_ERROR_STOP=1 -f tests/database/fos007_local_supabase_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/fos_006_shared_workspace_school_ledger.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/fos_007_school_agent_rpc.sql
      - name: Verify local Auth, Data API, and RPC boundary
        shell: bash
        env:
          FOS_LOCAL_SUPABASE_TEST: '1'
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          FOS_LOCAL_STATUS_FILE="$RUNNER_TEMP/fos007-status.env" node --experimental-strip-types --test tests/database/fos007_local_supabase.test.ts
