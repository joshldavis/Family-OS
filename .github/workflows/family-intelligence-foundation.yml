name: Family Intelligence Foundation checks

on:
  pull_request:
    paths:
      - 'src/intelligence/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/family-intelligence-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:foundation
